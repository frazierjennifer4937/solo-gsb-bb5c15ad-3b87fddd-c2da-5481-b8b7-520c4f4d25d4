services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/data/plans.db
    volumes:
      - nesting-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  nesting-data:
